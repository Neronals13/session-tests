<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тести до сесії</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=Noto+Sans+Math&display=swap" rel="stylesheet">
<style>
/* Ідея: зошит у клітинку, синя кулькова ручка як акцент, варіанти відповідей як бланк із літерами А Б В Г */
:root{
  --paper:#F3F5FB; --grid:rgba(36,56,216,.06); --card:#FFFFFF; --ink:#0F1733; --muted:#586080; --line:#D5DBEC;
  --accent:#2438D8; --accent-soft:#E6E9FC; --on-accent:#FFFFFF;
  --ok:#13803F; --ok-soft:#E2F4E8; --bad:#C62828; --bad-soft:#FCE7E7; --warn:#9A5B00; --warn-soft:#FDF0D8;
  --shadow:0 1px 0 rgba(15,23,51,.04),0 10px 24px -14px rgba(15,23,51,.22);
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text","Noto Sans Math","Cambria Math","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1226; --grid:rgba(140,160,255,.07); --card:#141B35; --ink:#E8ECFA; --muted:#9AA4C8; --line:#29325E;
    --accent:#8D9BFF; --accent-soft:#1F2850; --on-accent:#0C1226;
    --ok:#5ED18B; --ok-soft:#12301F; --bad:#FF8A8A; --bad-soft:#3A1717; --warn:#F0B35A; --warn-soft:#3A2B10;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1226; --grid:rgba(140,160,255,.07); --card:#141B35; --ink:#E8ECFA; --muted:#9AA4C8; --line:#29325E;
  --accent:#8D9BFF; --accent-soft:#1F2850; --on-accent:#0C1226;
  --ok:#5ED18B; --ok-soft:#12301F; --bad:#FF8A8A; --bad-soft:#3A1717; --warn:#F0B35A; --warn-soft:#3A2B10;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; min-height:100vh;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em;background:none;border:0;padding:0;color:var(--ink)}
.brand i{width:26px;height:26px;border:2px solid var(--accent);border-radius:6px;display:grid;place-items:center;font-style:normal;color:var(--accent);font-size:13px;background:var(--card)}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;min-width:0}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--accent);font-weight:600}
.link:hover{background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 16px -10px var(--accent)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.eyebrow{font-size:13px;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5.4vw,40px);letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:18px}
.lead{color:var(--muted);max-width:60ch;margin:10px 0 0}
.hero{padding:22px 0 18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.subj{display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;transition:transform .15s,border-color .15s}
.subj:hover{transform:translateY(-2px);border-color:var(--accent)}
.subj .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.subj h2{font-size:20px}
.pct{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.pct small{font-size:15px;font-weight:500}
.meta{color:var(--muted);font-size:14px}
.soon{border-style:dashed;box-shadow:none;background:transparent;color:var(--muted);display:flex;align-items:center;min-height:132px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.b-m{background:var(--ok)}.b-l{background:var(--accent)}.b-w{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sec{margin-top:28px}
.sec>h2{margin-bottom:12px}
.mode{display:flex;flex-direction:column;gap:14px}
.mode h2{display:flex;align-items:center;gap:10px}
.mode p{margin:0;color:var(--muted);font-size:15px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px;min-height:34px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;background:none;border:0;padding:0;text-align:left}
.sw i{flex:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{transform:translateX(16px)}
.topics{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:6px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .nm{font-weight:500}
.trow .meta{grid-column:1}
@media(max-width:560px){.trow{grid-template-columns:minmax(0,1fr) auto}.trow .bar{grid-column:1/-1;order:3}}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:16px}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td,.hist th{padding:8px 6px;text-align:left;border-top:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:500;border-top:0;font-size:13px}
.foot{margin-top:36px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
/* ---- тест ---- */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}
.qhead .t{font-weight:600;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;padding:4px 10px;border:1.5px solid var(--line);border-radius:99px;background:var(--card)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{padding:22px 22px 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.src{background:transparent;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(18px,3.4vw,21px);font-weight:500;line-height:1.45;margin:0 0 18px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;transition:border-color .12s,background .12s;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);margin-top:-1px}
.opt .tx{padding-top:3px;min-width:0}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .ltr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{pointer-events:none}
.verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:15px}
.verdict.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict b{display:block;margin-bottom:2px}
.note{margin-top:8px;color:var(--ink);opacity:.9}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.nav button{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.nav button.dn{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav button.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kbd{font-size:12px;color:var(--muted)}
/* ---- результат ---- */
.score{display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(54px,14vw,88px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;font-weight:500}
.grade{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.grade.bad{background:var(--bad-soft);color:var(--bad)}.grade.good{background:var(--ok-soft);color:var(--ok)}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:15px;margin-top:8px}
.stats b{color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.wrong{display:flex;flex-direction:column;gap:12px}
.wi{padding:16px}
.wi .qtext{font-size:17px;margin-bottom:10px}
.ans{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-top:6px;font-size:15px;overflow-wrap:anywhere}
.ans.you{background:var(--bad-soft)}.ans.right{background:var(--ok-soft)}.ans.skip{background:var(--warn-soft)}
.ans small{flex:none;min-width:74px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:3px}
.tb{display:flex;flex-direction:column;gap:10px}
.tbr{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:12px;align-items:center;font-size:14px}
@media(max-width:520px){.tbr{grid-template-columns:minmax(0,1fr) 60px 40px}}
.tbr .bar{height:8px}
.tbr span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
/* ---- вчити ---- */
.tools{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;font:inherit}
.search:focus-visible{border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}
.si{padding:16px 18px}
.si .qtext{font-size:17px;margin-bottom:10px}
.so{display:flex;gap:10px;padding:7px 10px;border-radius:10px;font-size:15px;overflow-wrap:anywhere}
.so+.so{margin-top:4px}
.so.ok{background:var(--ok-soft)}
.so .mk{flex:none;width:20px;text-align:center;font-weight:700;color:var(--ok)}
.hide .so.ok{background:transparent}.hide .so .mk{visibility:hidden}
.hide:not(.shown) .so.ok{background:transparent}
.shown .so.ok{background:var(--ok-soft)}.shown .so .mk{visibility:visible}
.reveal{margin-top:10px}
.shown .reveal{display:none}
.empty{text-align:center;color:var(--muted);padding:36px 0}
/* ---- формули ---- */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1.25;font-size:.95em}
.frac .n{border-bottom:1.3px solid currentColor;padding:0 .25em .05em}
.frac .d{padding:.05em .25em 0}
.vec{position:relative;display:inline-block;padding-top:.05em}
.vec::after{content:"→";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);font-size:.7em;line-height:1}
.mx{display:inline-grid;vertical-align:middle;margin:.2em .35em;padding:.1em .6em;gap:.1em .9em;text-align:center;position:relative;font-size:.95em;line-height:1.3}
.mx.det{border-left:1.6px solid currentColor;border-right:1.6px solid currentColor}
.mx.mat{border-left:1.6px solid currentColor;border-right:1.6px solid currentColor;border-radius:.7em/50%}
.mx.brace::before,.mx.brace::after,.mx.sys::before{position:absolute;top:50%;font-weight:200;line-height:1;transform:translateY(-50%) scaleY(var(--r));font-size:1.7em}
.mx.brace::before{content:"{";left:-.35em}.mx.brace::after{content:"}";right:-.35em}
.mx.sys::before{content:"{";left:-.4em}
.mx.sys{text-align:left;padding-left:.8em;gap:.15em 0}
.mx.sys.one{grid-template-columns:auto}
.mx.sys span{white-space:nowrap}
@media(max-width:520px){.mx.sys span{white-space:normal}}
/* ---- картинки, риски, нові типи питань ---- */
.fm{max-width:100%;height:auto;background:#fff;border-radius:6px;padding:3px 8px;vertical-align:middle;display:inline-block;max-height:150px;width:auto}
.opt .fm,.so .fm,.mr .fm,.ml .fm{max-height:90px}
.opt .fm{vertical-align:top;margin-top:-2px}
.fm.dg{max-height:140px}
.opt .fm.dg,.so .fm.dg,.mr .fm.dg{max-height:130px}
.ov{border-top:1.5px solid currentColor;padding-top:1px}
.ov2{border-top:4.5px double currentColor}
.hint{margin:-8px 0 14px;color:var(--muted);font-size:14px}
.opt .ltr.sq{border-radius:8px}
.blank{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--accent);margin:0 .15em;vertical-align:baseline}
.fillbox{display:flex;flex-direction:column;gap:10px}
.fillbox .search{font-size:18px;min-height:52px}
.fillbox .search.ok{border-color:var(--ok);background:var(--ok-soft)}
.fillbox .search.bad{border-color:var(--bad);background:var(--bad-soft)}
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.mrow.ok{border-color:var(--ok);background:var(--ok-soft)}
.mrow.bad{border-color:var(--bad);background:var(--bad-soft)}
.mrow .ml{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.mpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pk{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--muted);background:var(--card);font-weight:700;font-size:14px;color:var(--muted)}
.pk:hover{border-color:var(--accent);color:var(--accent)}
.pk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pk.key{background:var(--ok);border-color:var(--ok);color:#fff}
.pk.no{background:var(--bad);border-color:var(--bad);color:#fff}
.mpick .fix{font-size:13px;color:var(--ok);font-weight:700;margin-left:4px}
.mrows.lock .pk{pointer-events:none}
.mright{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.mright .lab{font-size:13px;font-weight:600;color:var(--muted)}
.mr{display:flex;gap:12px;align-items:flex-start;padding:6px 4px}
.mr .ltr{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted)}
.mr .tx{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.pl{display:flex;flex-direction:column;gap:6px}
.pr{display:block}
.hide:not(.shown) .secret{visibility:hidden}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
  <noscript><p>Для роботи сайту потрібен JavaScript.</p></noscript>
</div>
<script src="data/subjects.js"></script>
<script>
(function(){
'use strict';
/* ================= утиліти ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LETTERS=['А','Б','В','Г','Д','Е','Є','Ж'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function plural(n,one,few,many){const m=n%100,d=n%10;if(m>10&&m<20)return many;if(d===1)return one;if(d>=2&&d<=4)return few;return many;}
function mmss(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function mx(kind,body){
  const rows=body.split(';').map(r=>r.trim()).filter(Boolean);
  if(kind==='sys'){return '<span class="mx sys" style="--r:'+Math.max(1,rows.length*.62)+'">'+rows.map(r=>'<span>'+r+'</span>').join('')+'</span>';}
  const cells=rows.map(r=>r.split(/\s+/));
  const cols=Math.max.apply(null,cells.map(r=>r.length));
  const flat=cells.map(r=>{while(r.length<cols)r.push('');return r.map(c=>'<span>'+c+'</span>').join('');}).join('');
  return '<span class="mx '+kind+'" style="grid-template-columns:repeat('+cols+',auto);--r:'+Math.max(1,rows.length*.62)+'">'+flat+'</span>';
}
function fmt(s){
  return esc(s).replace(/\[\[(f|det|mat|brace|sys|v|ov2|ov|img):([\s\S]*?)\]\]/g,function(m,k,b){
    if(k==='img')return '<img class="fm'+(/\.svg$/.test(b)?' dg':'')+'" src="data/img/'+b+'" alt="малюнок">';
    if(k==='ov')return '<span class="ov">'+b+'</span>';
    if(k==='ov2')return '<span class="ov ov2">'+b+'</span>';
    if(k==='f'){let i=b.indexOf('§'),sep=1;if(i<0){i=b.indexOf('|');}if(i<0)return b;return '<span class="frac"><span class="n">'+b.slice(0,i)+'</span><span class="d">'+b.slice(i+sep)+'</span></span>';}
    if(k==='v')return '<span class="vec">'+b+'</span>';
    return mx(k,b);
  });
}

/* ================= сесії ================= */
function makeItem(q){
  const k=q.k||'s';
  if(k==='m'){return {q:q,k:k,opts:shuffle(q.o.map((t,i)=>({t:t,ok:i<q.c}))),sel:[],picked:null,done:false};}
  if(k==='f'){return {q:q,k:k,val:'',picked:null,done:false};}
  if(k==='x'&&q.ord){const rights=q.p.map((p,i)=>({t:p[1],k:i})).sort((a,b)=>(+a.t)-(+b.t));return {q:q,k:k,rights:rights,ans:q.p.map(()=>null),picked:null,done:false};}
  if(k==='x'){const rights=shuffle(q.p.map((p,i)=>({t:p[1],k:i})).concat((q.e||[]).map(t=>({t:t,k:-1}))));return {q:q,k:k,rights:rights,ans:q.p.map(()=>null),picked:null,done:false};}
  return {q:q,k:'s',opts:shuffle(q.o.map((t,i)=>({t:t,ok:i===0}))),picked:null,done:false};
}
function makeItems(qs){return qs.map(makeItem);}
function nrm(s){return s.toLowerCase().replace(/[’ʼ'`‘]/g,'').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function nnum(s){s=s.replace(/\s/g,'');if(!/^[-+]?\d*[.,]?\d+$/.test(s))return null;return parseFloat(s.replace(',','.'));}
function fillOk(it){const v=nrm(it.val);if(!v)return false;const vn=nnum(it.val);return it.q.a.some(a=>{const wn=nnum(a);if(wn!==null)return vn!==null&&vn===wn;const w=nrm(a);return v===w||(w.length>=7&&lev(v,w)<=1);});}
function hasAns(it){switch(it.k){case 'm':return it.sel.length>0;case 'f':return it.val.trim()!=='';case 'x':return it.ans.some(a=>a!==null);default:return it.picked!==null;}}
function isGood(it){switch(it.k){
  case 'm':{const ok=[];it.opts.forEach((o,i)=>{if(o.ok)ok.push(i);});return ok.length===it.sel.length&&ok.every(i=>it.sel.includes(i));}
  case 'f':return fillOk(it);

  default:return it.picked!==null&&it.opts[it.picked].ok;}}

function rightHTML(it){switch(it.k){

  let verdict='';
  if(it.done){const good=isGood(it);
    verdict='<div class="verdict '+(good?'ok':'bad')+'" role="status"><b>'+(good?'Правильно':'Неправильно')+'</b>'+(good?'':(it.k==='x'?'Правильні пари: ':it.k==='m'?'Правильні відповіді: ':'Правильна відповідь: ')+rightHTML(it))+(it.q.n?'<div class="note">'+esc(it.q.n)+'</div>':'')+'</div>';}
  const multi=it.k!=='s';
  let foot='';
  if(exam){
    const nav=s.items.map((x,i)=>'<button class="'+(i===s.i?'cur':hasAns(x)?'dn':'')+'" data-act="jump" data-i="'+i+'" aria-label="Питання '+(i+1)+'">'+(i+1)+'</button>').join('');
    foot='<div class="qfoot"><button class="btn ghost sm" data-act="prev" '+(s.i===0?'disabled':'')+'>Назад</button>'+
      (s.i<n-1?'<button class="btn sm" data-act="next">Далі</button>':'<button class="btn sm" data-act="finish-ask">Завершити</button>')+'</div>'+
      '<div class="nav">'+nav+'</div>'+
      (app.confirmFinish?'<div class="banner" style="margin-top:16px"><span>'+(answered<n?'Без відповіді залишилось '+(n-answered)+'. ':'')+'Завершити тест?</span><span><button class="btn sm" data-act="finish-yes">Завершити</button> <button class="link" data-act="finish-no">Ще ні</button></span></div>':'<div class="qfoot"><span class="kbd">'+(it.k==='s'?'Клавіші 1–'+it.opts.length+' вибирають відповідь, стрілки перемикають питання':'Відповідь зберігається одразу, до питання можна повернутися')+'</span><button class="link" data-act="finish-ask">Завершити тест</button></div>');
  }else{
    const right=it.done?'<button class="btn sm" data-act="next">'+(s.i<n-1?'Далі':'Підсумок')+'</button>':(multi?'<button class="btn sm" data-act="check">Перевірити</button>':'<span></span>');
    foot='<div class="qfoot"><span class="kbd">'+(it.done?'Enter — далі':it.k==='s'?'Клавіші 1–'+it.opts.length+' вибирають відповідь':it.k==='m'?'Клавіші 1–'+it.opts.length+' ставлять і знімають позначки':it.k==='f'?'Enter — перевірити':'')+'</span>'+right+'</div>';
  }
  el.innerHTML='<div class="qhead"><span class="t">'+(exam?'Іспит':esc(s.label||'Тренування'))+' · '+(s.i+1)+' з '+n+'</span><span class="timer" id="timer" '+(exam&&s.limit?'':'hidden')+'>00:00</span><button class="link" data-act="quit">Вийти</button></div>'+
   '<div class="prog"><span style="width:'+(prog*100).toFixed(1)+'%"></span></div>'+
   '<div class="card qcard"><div class="tags"><span class="tag">'+esc(tname)+'</span><span class="tag src" title="Номер у вихідному файлі">'+esc(it.q.id)+'</span></div><p class="qtext">'+qtextHTML(it)+'</p>'+bodyHTML(it)+verdict+foot+'</div>';
  if(exam&&s.limit){stopTimer();tick();app.timerId=setInterval(tick,1000);}
  else stopTimer();
  if(it.k==='f'&&!it.done){const f=$('#fill');if(f){f.focus();const l=f.value.length;try{f.setSelectionRange(l,l);}catch(e){}}}
}
function check(){
  const s=app.session,it=s.items[s.i];if(!s||it.done||s.mode==='exam'||it.k==='s')return;
  it.done=true;record(s.sid,it.q.id,isGood(it));store.save();renderQuiz($('#app'));
}
function tog(i){const s=app.session,it=s.items[s.i];if(it.done||it.k!=='m')return;const k=it.sel.indexOf(i);if(k>=0)it.sel.splice(k,1);else it.sel.push(i);renderQuiz($('#app'));}
function mset(i,j){const s=app.session,it=s.items[s.i];if(it.done||it.k!=='x')return;
  if(it.ans[i]===j){it.ans[i]=null;}else{it.ans=it.ans.map(a=>a===j?null:a);it.ans[i]=j;}
  renderQuiz($('#app'));}
function updNav(){const s=app.session;if(!s||s.mode!=='exam')return;const nb=document.querySelectorAll('.nav button');nb.forEach((b,i)=>{if(i!==s.i)b.className=hasAns(s.items[i])?'dn':'';});
  const pr=document.querySelector('.prog span');if(pr)pr.style.width=(s.items.filter(hasAns).length/s.items.length*100).toFixed(1)+'%';}
function pick(i){
  const s=app.session,it=s.items[s.i];if(it.done)return;
  if(s.mode==='exam'){it.picked=i;renderQuiz($('#app'));return;}
  it.picked=i;it.done=true;record(s.sid,it.q.id,it.opts[i].ok);store.save();renderQuiz($('#app'));
}
function next(){const s=app.session,n=s.items.length;if(s.mode!=='exam'&&!s.items[s.i].done)return;if(s.i<n-1){s.i++;app.confirmFinish=false;renderQuiz($('#app'));window.scrollTo(0,0);}else if(s.mode!=='exam'){finish();}}
function prev(){const s=app.session;if(s.i>0){s.i--;renderQuiz($('#app'));window.scrollTo(0,0);}}
/* ================= результат ================= */
function gradeOf(p){
  if(p>=90)return ['Відмінно','good'];if(p>=82)return ['Дуже добре','good'];if(p>=74)return ['Добре','good'];
  if(p>=64)return ['Задовільно',''];if(p>=60)return ['Достатньо',''];return ['Незадовільно','bad'];
}
function renderResult(el){
  const s=app.session,b=app.bank,exam=s.mode==='exam';topbar(b.title);
  const n=s.items.length;const g=gradeOf(s.pct);
  const wrongs=s.items.filter(it=>!isGood(it));
  const by={};s.items.forEach(it=>{const k=it.q.t;by[k]=by[k]||{n:0,ok:0};by[k].n++;if(isGood(it))by[k].ok++;});
  const tb=b.topics.filter(t=>by[t.id]).map(t=>{const r=by[t.id];const p=Math.round(r.ok/r.n*100);return '<div class="tbr"><span>'+esc(t.title)+'</span><div class="bar"><span class="'+(p>=60?'b-m':'b-w')+'" style="width:'+p+'%"></span></div><span>'+r.ok+'/'+r.n+'</span></div>';}).join('');
  const wl=wrongs.map(it=>{
    return '<div class="card wi"><div class="tags"><span class="tag src">'+esc(it.q.id)+'</span></div><p class="qtext">'+qtextHTML(it)+'</p>'+
     (!hasAns(it)?'<div class="ans skip"><small>Без відповіді</small><span></span></div>':'<div class="ans you"><small>Твоя</small><span>'+yourHTML(it)+'</span></div>')+
     '<div class="ans right"><small>Правильна</small><span>'+rightHTML(it)+'</span></div>'+(it.q.n?'<div class="note meta">'+esc(it.q.n)+'</div>':'')+'</div>';}).join('');
  el.innerHTML='<section class="hero" style="padding-top:8px"><p class="eyebrow">'+(exam?'Результат іспиту':'Підсумок тренування')+'</p>'+
   '<div class="score"><div class="big">'+s.pct+'<small>%</small></div><div>'+(exam?'<span class="grade '+g[1]+'">'+g[0]+'</span>':'')+
   '<div class="stats"><span>Правильно <b>'+s.ok+' з '+n+'</b></span><span>Час <b>'+mmss(s.sec)+'</b></span></div></div></div>'+
   '<div class="cta">'+(wrongs.length?'<button class="btn" data-act="retry-wrong">Повторити помилки ('+wrongs.length+')</button>':'')+
   '<button class="btn ghost" data-act="again">'+(exam?'Новий іспит':'Ще тренування')+'</button><button class="btn ghost" data-act="open" data-id="'+s.sid+'">До предмета</button></div></section>'+
   '<div class="sec"><h2>За темами</h2><div class="card tb">'+tb+'</div></div>'+
   '<div class="sec"><h2>'+(wrongs.length?'Над чим попрацювати':'Без помилок')+'</h2>'+(wrongs.length?'<div class="wrong">'+wl+'</div>':'<div class="card empty">Усі відповіді правильні.</div>')+'</div>';
}
/* ================= список ================= */
function normalize(s){return s.toLowerCase().replace(/\[\[[a-z0-9]+:/g,' ').replace(/\]\]/g,' ');}
function flat(x){return [x.q].concat(x.o||[],x.a||[],(x.p||[]).reduce((a,p)=>a.concat(p),[]),x.e||[]).join(' ');}
function studyList(){
  const b=app.bank,q=app.study.q.trim().toLowerCase(),t=app.study.topic;
  const items=b.questions.filter(x=>(!t||x.t===t)&&(!q||normalize(flat(x)+' '+x.id).includes(q)));
  const shown=items.slice(0,app.study.shown);
  const html=shown.map(x=>{let rot;const k=x.k||'s';
    if(k==='f'){rot=['<div class="so ok secret"><span class="mk">✓</span><span><b>'+esc(x.a[0])+'</b></span></div>'];}
    else if(k==='x'){rot=x.p.map(p=>'<div class="so"><span class="mk"></span><span>'+fmt(p[0])+' → <span class="secret">'+fmt(p[1])+'</span></span></div>');
      if(x.e&&x.e.length)rot.push('<div class="so"><span class="mk"></span><span class="meta">Зайвий варіант: <span class="secret">'+x.e.map(fmt).join('; ')+'</span></span></div>');}
    else{const nok=k==='m'?x.c:1;
      const opts=x.o.map((o,i)=>'<div class="so'+(i<nok?' ok':'')+'"><span class="mk">'+(i<nok?'✓':'')+'</span><span>'+fmt(o)+'</span></div>');
      // правильні завжди перші у вихідних даних, тому у списку зсуваємо детерміновано
      const seed=x.id.split('').reduce((a,c)=>a+c.charCodeAt(0),0)%opts.length;
      rot=opts.slice(seed).concat(opts.slice(0,seed));}
    return '<div class="card si'+(app.prefs.hideAns?' hide':'')+'" data-q="'+esc(x.id)+'"><div class="tags"><span class="tag">'+esc((b.topics.find(tt=>tt.id===x.t)||{}).title||'')+'</span><span class="tag src">'+esc(x.id)+'</span></div><p class="qtext">'+(k==='f'?fmt(x.q).replace(/____/g,'<span class="blank">&nbsp;</span>'):fmt(x.q))+'</p>'+(k==='m'?'<p class="hint" style="margin:-4px 0 8px">Правильних відповідей: '+x.c+'</p>':'')+rot.join('')+(app.prefs.hideAns?'<button class="btn ghost sm reveal" data-act="reveal">Показати відповідь</button>':'')+(x.n?'<div class="note meta" style="margin-top:8px">'+esc(x.n)+'</div>':'')+'</div>';}).join('');
  const more=items.length>shown.length?'<button class="btn ghost" data-act="more" style="align-self:center">Показати ще ('+(items.length-shown.length)+')</button>':'';
  return {count:items.length,html:html||'<div class="empty">Нічого не знайдено. Спробуй інше слово.</div>',more:more};
}
function renderStudy(el){
  const b=app.bank;topbar(b.title);
  const chips=['<button class="chip" data-act="stopic" data-id="" aria-pressed="'+(app.study.topic==='')+'">Усі теми</button>'].concat(b.topics.map(t=>'<button class="chip" data-act="stopic" data-id="'+t.id+'" aria-pressed="'+(app.study.topic===t.id)+'">'+esc(t.title)+'</button>')).join('');
  el.innerHTML='<section class="hero" style="padding-top:8px"><button class="link" data-act="open" data-id="'+app.sid+'" style="padding-left:0">← До предмета</button><h1>Усі питання</h1></section>'+
   '<div class="tools"><input class="search" id="q" type="search" placeholder="Пошук за словом або номером, наприклад B98" value="'+esc(app.study.q)+'" aria-label="Пошук"><div class="chips" id="schips">'+chips+'</div>'+
   '<button class="sw" role="switch" id="hide" data-act="hide" aria-checked="'+app.prefs.hideAns+'"><i></i><span>Сховати відповіді (перевірка себе)</span></button><div class="meta" id="cnt"></div></div><div class="list" id="list"></div>';
  paintStudy();
  $('#q').addEventListener('input',e=>{app.study.q=e.target.value;app.study.shown=40;paintStudy();});
}
function paintStudy(){
  const r=studyList();$('#cnt').textContent='Показано '+Math.min(app.study.shown,r.count)+' з '+r.count;
  $('#list').innerHTML=r.html+r.more;
}
/* ================= події ================= */
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,P=app.prefs;
  switch(a){
    case 'home':go('home');break;
    case 'open':go(t.dataset.id);break;
    case 'resume':go(app.sid+'-quiz');break;
    case 'study':app.study.shown=40;go(app.sid+'-study');break;
    case 'topic-all':P.topics=[];savePrefs();renderHub($('#app'));break;
    case 'topic':{const id=t.dataset.id;P.topics=P.topics.includes(id)?P.topics.filter(x=>x!==id):P.topics.concat(id);savePrefs();renderHub($('#app'));break;}
    case 'count':P.count=+t.dataset.n;savePrefs();renderHub($('#app'));break;
    case 'examn':P.examN=+t.dataset.n;savePrefs();renderHub($('#app'));break;
    case 'skip':P.skip=!P.skip;savePrefs();renderHub($('#app'));break;
    case 'timer':P.timer=!P.timer;savePrefs();renderHub($('#app'));break;
    case 'start-practice':startPractice(P.topics,P.count,P.skip,'Тренування');break;
    case 'train-topic':startPractice([t.dataset.id],0,P.skip,(app.bank.topics.find(x=>x.id===t.dataset.id)||{}).title);break;
    case 'start-exam':startExam();break;
    case 'start-mistakes':startMistakes();break;
    case 'reset':app.confirmReset=true;renderHub($('#app'));break;
    case 'reset-no':app.confirmReset=false;renderHub($('#app'));break;
    case 'reset-yes':store.data.subjects[app.sid]={q:{},exams:[]};store.save();app.confirmReset=false;renderHub($('#app'));break;
    case 'pick':pick(+t.dataset.i);break;
    case 'tog':tog(+t.dataset.i);break;
    case 'mset':mset(+t.dataset.i,+t.dataset.j);break;
    case 'check':check();break;
    case 'next':next();break;
    case 'prev':prev();break;
    case 'jump':app.session.i=+t.dataset.i;renderQuiz($('#app'));break;
    case 'finish-ask':app.confirmFinish=true;renderQuiz($('#app'));break;
    case 'finish-no':app.confirmFinish=false;renderQuiz($('#app'));break;
    case 'finish-yes':finish();break;
    case 'quit':stopTimer();go(app.sid);break;
    case 'again':if(app.session.mode==='exam')startExam();else startPractice(P.topics,P.count,P.skip,'Тренування');break;
    case 'retry-wrong':{const qs=app.session.items.filter(it=>!isGood(it)).map(it=>it.q);startSession('practice',shuffle(qs),0,'Помилки');break;}
    case 'stopic':app.study.topic=t.dataset.id;app.study.shown=40;document.querySelectorAll('#schips .chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===app.study.topic)));paintStudy();break;
    case 'hide':P.hideAns=!P.hideAns;savePrefs();t.setAttribute('aria-checked',String(P.hideAns));paintStudy();break;
    case 'reveal':t.closest('.si').classList.add('shown');break;
    case 'more':app.study.shown+=40;paintStudy();break;
  }
});
document.addEventListener('input',function(e){
  if(!e.target||e.target.id!=='fill')return;const s=app.session;if(!s||s.finished)return;const it=s.items[s.i];if(it.k!=='f'||it.done)return;
  it.val=e.target.value;updNav();
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='fill'&&e.key==='Enter'){const s=app.session;if(s&&!s.finished){const it=s.items[s.i];e.preventDefault();if(s.mode==='exam'){next();}else if(!it.done){if(it.val.trim())check();}else next();}return;}
  if(e.target&&(e.target.tagName==='INPUT'))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const s=app.session;if(!s||s.finished||location.hash.slice(1)!==s.sid+'-quiz')return;
  const it=s.items[s.i];
  if(/^[1-8]$/.test(e.key)){const i=+e.key-1;if(it.k==='s'&&i<it.opts.length){pick(i);e.preventDefault();}else if(it.k==='m'&&i<it.opts.length){tog(i);e.preventDefault();}}
  else if(e.key==='Enter'){if(s.mode!=='exam'&&it.done){next();e.preventDefault();}else if(s.mode!=='exam'&&it.k==='m'){check();e.preventDefault();}}
  else if(e.key==='ArrowRight'&&s.mode==='exam'){next();}
  else if(e.key==='ArrowLeft'&&s.mode==='exam'){prev();}
});
route();
})();
</script>
</body>
</html>
